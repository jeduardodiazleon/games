<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cosmic Traffic Jam · Pocket Arcade</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Limelight&family=Special+Elite&display=swap">
<style>
body{margin:0;padding:0}
/* Layout: una sola pantalla de juego a sangre; menú de tres cartuchos apilados en móvil, en fila en escritorio. */
:root {
  color-scheme: dark;
  --noche: #120f24;
  --noche-2: #1c1836;
  --tinta: #f3efff;
  --tinta-2: #a9a2cc;
  --orbita: #ffb347;   /* Atasco Cósmico */
  --infierno: #ff4d5e; /* Ascensor del Infierno */
  --sombra: #9b8cff;   /* Mi Sombra Me Odia */
  --borde: #2d2852;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --ui: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--noche);
  color: var(--tinta);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

/* ---------- Menú ---------- */
#menu {
  position: absolute; inset: 0; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 24px;
  background:
    radial-gradient(120% 60% at 50% -10%, #2a1f5c 0%, transparent 60%),
    var(--noche);
}
.menu-inner { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.marca { display: flex; flex-direction: column; gap: 6px; }
.marca h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 54px); line-height: 1; margin: 0; letter-spacing: .5px; text-wrap: balance; }
.marca h1 span { color: var(--orbita); }
.marca p { margin: 0; color: var(--tinta-2); font-size: 15px; max-width: 52ch; }
.cartuchos { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .cartuchos { grid-template-columns: repeat(3, 1fr); } }
.cartucho {
  --c: var(--orbita);
  position: relative; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center;
  padding: 14px; border-radius: 14px;
  background: var(--noche-2); color: var(--tinta);
  border: 1px solid var(--borde);
  font: inherit;
  transition: transform .15s ease, border-color .15s ease;
}
.cartucho:hover, .cartucho:focus-visible { border-color: var(--c); transform: translateY(-2px); outline: none; }
.cartucho:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 40%, transparent); }
.cartucho canvas { position: static; width: 76px; height: 76px; border-radius: 10px; background: #0b0918; touch-action: auto; }
.cartucho h2 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 0 0 4px; color: var(--c); line-height: 1.1; }
.cartucho p { margin: 0; color: var(--tinta-2); font-size: 14px; line-height: 1.35; }
.cartucho .record { margin-top: 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.cartucho .record b { color: var(--tinta); }
.pie { color: var(--tinta-2); font-size: 12px; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding-top: 10px; padding-bottom: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
.btn-hud {
  font: 600 14px var(--ui); color: var(--tinta); background: rgba(28,24,54,.8);
  border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
.btn-hud:focus-visible { outline: 2px solid var(--tinta); }
#hudTitulo { flex: 1; min-width: 0; font-family: var(--display); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hudPuntos { font: 700 22px var(--ui); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
#hudVidas { font-size: 16px; letter-spacing: 2px; }

/* ---------- Overlay ---------- */
#overlay {
  position: absolute; inset: 0; z-index: 8;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  background: rgba(10, 8, 22, .72);
  backdrop-filter: blur(3px);
}
.panel {
  --c: var(--orbita);
  width: min(420px, 100%); background: var(--noche-2); border: 1px solid var(--borde);
  border-top: 4px solid var(--c); border-radius: 14px; padding: 22px 20px 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.panel h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; color: var(--c); line-height: 1.05; text-wrap: balance; }
.panel p { margin: 0; color: var(--tinta-2); font-size: 15px; line-height: 1.45; }
.panel ul { margin: 0; padding-left: 18px; color: var(--tinta); font-size: 15px; line-height: 1.5; display: grid; gap: 4px; }
.marcador { display: flex; gap: 24px; font-variant-numeric: tabular-nums; }
.marcador div { display: flex; flex-direction: column; }
.marcador small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-2); }
.marcador strong { font: 700 34px var(--ui); }
.botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.btn {
  font: 700 16px var(--ui); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 0;
  background: var(--c); color: #160f06; flex: 1;
}
.btn.sec { background: transparent; color: var(--tinta); border: 1px solid var(--borde); }
.btn:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
.panel .intro { color: var(--tinta); font-style: italic; border-left: 3px solid var(--c); padding-left: 10px; }
.panel ul b { color: var(--c); font-weight: 700; }
.mejoras { display: grid; gap: 8px; }
.mejora {
  display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer;
  font: inherit; color: var(--tinta); background: #15122b; border: 1px solid var(--borde);
  border-radius: 10px; padding: 12px 14px;
}
.mejora b { font: 700 16px var(--ui); color: var(--c); }
.mejora span { color: var(--tinta-2); font-size: 14px; }
.mejora:hover, .mejora:focus-visible { border-color: var(--c); outline: none; }
.panel { max-height: calc(100% - 8px); overflow-y: auto; }
/* ---------- Tema "años 30" del Ascensor ---------- */
#app.retro #hud .btn-hud { background: #f8eed6; color: #1d1510; border: 2px solid #1d1510; font-family: "Special Elite", monospace; }
#app.retro #hudTitulo { font-family: "Limelight", serif; color: #1d1510 !important; }
#app.retro #hudPuntos { font-family: "Alfa Slab One", serif; color: #b8412f; font-weight: 400; }
#app.retro #hudVidas { color: #b8412f !important; }
#app.retro #overlay { background: rgba(40, 25, 10, .55); }
.panel.retro { background: #f8eed6; color: #1d1510; border: 2.5px solid #1d1510; border-top: 6px solid #b8412f; }
.panel.retro h3 { font-family: "Limelight", serif; color: #b8412f; }
.panel.retro p, .panel.retro .marcador small { color: #5a4636; font-family: "Special Elite", monospace; }
.panel.retro .intro { color: #1d1510; border-left-color: #b8412f; }
.panel.retro ul { color: #1d1510; }
.panel.retro ul b { color: #b8412f; }
.panel.retro .marcador strong { font-family: "Alfa Slab One", serif; font-weight: 400; color: #1d1510; }
.panel.retro .btn { background: #b8412f; color: #f8eed6; font-family: "Alfa Slab One", serif; font-weight: 400; letter-spacing: .03em; border: 2px solid #1d1510; }
.panel.retro .btn.sec { background: transparent; color: #1d1510; }
.panel.retro .mejora { background: #f1e3c2; border: 2px solid #1d1510; color: #1d1510; }
.panel.retro .mejora b { font-family: "Alfa Slab One", serif; font-weight: 400; color: #b8412f; }
.panel.retro .mejora span { color: #5a4636; font-family: "Special Elite", monospace; }
.panel.retro .mejora:hover, .panel.retro .mejora:focus-visible { border-color: #b8412f; }
@media (prefers-reduced-motion: reduce) { .cartucho { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="juego" aria-label="Game area"></canvas>

  <div id="hud" hidden>
    <button class="btn-hud" id="btnMenu" type="button">‹ Arcade</button>
    <div id="hudTitulo"></div>
    <div id="hudVidas" aria-label="Lives"></div>
    <div id="hudPuntos" aria-live="off">0</div>
    <button class="btn-hud" id="btnPausa" type="button" aria-label="Pause">❚❚</button>
  </div>

  <div id="overlay" hidden>
    <div class="panel" id="panel"></div>
  </div>

  <div id="menu" hidden></div>
</div>

<script>
(() => {
  "use strict";

  // ===================== Utilidades =====================
  const $ = (id) => document.getElementById(id);
  const cv = $("juego"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  const TOP = 58; // alto reservado al HUD

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (juego && juego.onResize) juego.onResize();
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  const store = {
    get(k) { try { return Number(localStorage.getItem("arcade_" + k)) || 0; } catch (e) { return 0; } },
    set(k, v) { try { localStorage.setItem("arcade_" + k, String(v)); } catch (e) {} },
  };

  // Estrellas de fondo compartidas
  let estrellas = [];
  function genEstrellas() {
    estrellas = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + .2, a: Math.random() * .6 + .2 }));
  }
  function pintarEstrellas(alpha = 1) {
    ctx.save();
    for (const s of estrellas) {
      ctx.globalAlpha = s.a * alpha;
      ctx.fillStyle = "#cfc8ff";
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // Textos flotantes (+1, etc.)
  let flotantes = [];
  function flotar(x, y, txt, color) { flotantes.push({ x, y, txt, color, t: 0 }); }
  function pintarFlotantes(dt) {
    ctx.save();
    ctx.textAlign = "center"; ctx.font = "700 16px " + css("--ui");
    flotantes = flotantes.filter((f) => (f.t += dt) < 0.9);
    for (const f of flotantes) {
      ctx.globalAlpha = 1 - f.t / 0.9;
      ctx.fillStyle = f.color;
      const mitad = ctx.measureText(f.txt).width / 2 + 8;
      ctx.fillText(f.txt, clamp(f.x, mitad, W - mitad), f.y - f.t * 40);
    }
    ctx.restore();
  }

  // Partículas de explosión
  let chispas = [];
  function explotar(x, y, color, n = 36) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rnd(60, 260);
      chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rnd(.5, 1.1), color });
    }
  }
  function pintarChispas(dt) {
    chispas = chispas.filter((c) => (c.t += dt) < c.life);
    for (const c of chispas) {
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .97; c.vy *= .97;
      ctx.globalAlpha = 1 - c.t / c.life;
      ctx.fillStyle = c.color;
      ctx.fillRect(c.x - 2, c.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  // ===================== GAME: Cosmic Traffic Jam (v2) =====================
  const Atasco = {
    id: "atasco", nombre: "Cosmic Traffic Jam", color: "--orbita",
    desc: "Planets share crossing orbits. Brake them, reverse them and survive each stage while meteors and a giant alien crash the party.",
    intro: "Space traffic control needs you. Keep the planets from crashing until the timer runs out. Every stage the system grows and new threats arrive.",
    reglas: [
      "<b>Tap</b> a planet to brake it, tap again to release it. Braked planets take off on their own after a few seconds.",
      "<b>Double-tap</b> or <b>right-click</b> a planet to <b>reverse</b> its direction.",
      "Survive the <b>timer</b> to clear the stage: 15 s, then 5 s longer every stage.",
      "The system grows every stage. Then come <b>meteors</b> (tap them to blast them) and a <b>giant alien</b> that eats any planet it touches.",
      "Tap the passing <b>spaceship</b> to win a power: <b>Laser</b>, <b>Black hole</b> or <b>Freeze</b>. Every lost planet costs a life. You have 3.",
    ],
    // Orbits in "system units": [x, y, radius]. They open one by one as stages advance.
    ORB: [[-.55, -.25, 1], [.55, -.25, 1], [0, .55, .85], [0, -.2, 1.55], [0, -.85, .6], [-1.3, .6, .7], [1.3, .6, .7]],
    POWERS: {
      laser: { name: "Laser", color: "#ff5f6d", hint: "LASER: tap a planet to destroy it" },
      hole: { name: "Black hole", color: "#c4b5fd", hint: "BLACK HOLE: tap where you want it" },
      freeze: { name: "Freeze", color: "#6ee7f9", hint: "" },
    },
    colores: ["#ffb347", "#6ee7f9", "#f472b6", "#a3e635", "#c4b5fd", "#fde047", "#fb7185", "#5eead4"],

    init() {
      this.puntos = 0; this.vidas = 3; this.over = false; this.stage = 0; this.t = 0;
      this.planetas = []; this.meteoros = []; this.monstruos = []; this.naves = []; this.agujeros = []; this.rayos = [];
      this.poderes = []; this.armado = null; this.freeze = 0; this.temblor = 0;
      this.slow = 1; this.paciencia = 3; this.S = null; this.nPlan = 0; this.nMonstruos = 0;
      this.mejoraPendiente = null; this.trasMejora = null;
      this.nextStage();
    },
    nextStage() {
      this.stage++; const s = this.stage;
      this.duracion = 15 + 5 * (s - 1); this.resta = this.duracion; this.ts = 0;
      this.nOrb = Math.min(this.ORB.length, s + 1);
      this.cap = Math.min(10, 2 + s, this.nOrb * 2);
      this.meteorOn = s >= 3; this.monsterOn = s >= 4;
      this.meteoros = []; this.monstruos = []; this.agujeros = [];
      this.proxMeteoro = 3; this.proxNave = s === 1 ? 6 : rnd(4, 8); this.proxPlaneta = 1.2;
      this.monsterPlan = [];
      if (this.monsterOn) {
        const n = s >= 7 ? 2 : 1;
        for (let i = 0; i < n; i++) this.monsterPlan.push(3 + i * (this.duracion - 8) / n + rnd(0, 2));
      }
      this.geo(0);
      if (s === 1) { this.nuevoPlaneta(0, 0); this.nuevoPlaneta(1, Math.PI); }
      else this.intentarNacer(this.nOrb - 1);
      const titulos = { 1: "SURVIVE " + this.duracion + "s", 2: "THE SYSTEM GROWS", 3: "METEOR SHOWER", 4: "GIANT ALIEN!" };
      this.banner = { txt: "STAGE " + s + " · " + (titulos[s] || "SURVIVE " + this.duracion + "s"), color: "#ffb347", t: 0 };
    },

    // ---------- geometry: the system zooms out smoothly as orbits open ----------
    geo(dt) {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (let i = 0; i < this.nOrb; i++) {
        const [x, y, r] = this.ORB[i];
        x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); y0 = Math.min(y0, y - r); y1 = Math.max(y1, y + r);
      }
      const aw = W - 24, ah = H - TOP - 30 - 64;
      const S = Math.min(aw / (x1 - x0), ah / (y1 - y0)) * 0.94;
      const ox = -(x0 + x1) / 2, oy = -(y0 + y1) / 2;
      if (this.S == null || !dt) { this.S = S; this.ox = ox; this.oy = oy; }
      else { const k = Math.min(1, dt * 1.8); this.S += (S - this.S) * k; this.ox += (ox - this.ox) * k; this.oy += (oy - this.oy) * k; }
      this.cx = W / 2; this.cy = TOP + 30 + ah / 2;
      this.pr = clamp(this.S * 0.12, 8, 12);
    },
    onResize() { this.S = null; if (this.ORB) this.geo(0); },
    orb(i) { const [x, y, r] = this.ORB[i]; return { x: this.cx + (x + this.ox) * this.S, y: this.cy + (y + this.oy) * this.S, r: r * this.S }; },
    pos(p) { const o = this.orb(p.o); return { x: o.x + Math.cos(p.a) * o.r, y: o.y + Math.sin(p.a) * o.r }; },

    nuevoPlaneta(o, a) {
      const p = { o, a, dir: Math.random() < .5 ? 1 : -1, frenado: false, espera: 0, recorrido: 0, nace: 0, ultimoToque: 0,
        color: this.colores[this.nPlan++ % this.colores.length] };
      this.planetas.push(p); return p;
    },
    intentarNacer(preferida) {
      for (let k = 0; k < 40; k++) {
        const o = (k < 12 && preferida != null) ? preferida : Math.floor(Math.random() * this.nOrb), a = rnd(0, Math.PI * 2);
        const P = this.pos({ o, a });
        if (this.planetas.every((q) => dist(P, this.pos(q)) > 75) &&
            this.monstruos.every((m) => m.warn > 0 || dist(P, this.monPos(m)) > m.R * 1.3)) { this.nuevoPlaneta(o, a); return true; }
      }
      return false;
    },
    darPoder() {
      const tipos = ["laser", "hole", "freeze"];
      const k = tipos[Math.floor(Math.random() * tipos.length)];
      if (this.poderes.length < 3) this.poderes.push(k);
      return k;
    },
    perderVida(x, y, txt) {
      this.vidas--; this.temblor = 0.45;
      flotar(x, y - 18, txt, "#ff8a8a");
      if (this.vidas <= 0) this.over = true;
    },

    // ---------- threats ----------
    nuevoMeteoro() {
      const lado = Math.floor(Math.random() * 4), m = 40;
      let x, y;
      if (lado === 0) { x = -m; y = rnd(TOP + 20, H - 20); }
      else if (lado === 1) { x = W + m; y = rnd(TOP + 20, H - 20); }
      else if (lado === 2) { x = rnd(20, W - 20); y = TOP - m; }
      else { x = rnd(20, W - 20); y = H + m; }
      const tx = this.cx + rnd(-.35, .35) * W, ty = this.cy + rnd(-.3, .3) * (H - TOP);
      const v = rnd(150, 220) + this.stage * 8, d = Math.hypot(tx - x, ty - y);
      this.meteoros.push({ x, y, vx: (tx - x) / d * v, vy: (ty - y) / d * v, r: rnd(8, 12), warn: 1, rot: rnd(0, 6), dentro: false });
    },
    nuevoMonstruo() {
      const R = clamp(Math.min(W, H - TOP) * 0.2, 60, 130);
      const yr = () => rnd(TOP + R * 0.7, H - R * 0.7), xr = () => rnd(R * 0.7, W - R * 0.7);
      const rutas = [
        () => { const y = yr(); return [-R * 1.4, y, W + R * 1.4, y]; },          // left → right
        () => { const x = xr(); return [x, H + R * 1.4, x, TOP - R * 1.4]; },      // bottom → top
        () => { const y = yr(); return [W + R * 1.4, y, -R * 1.4, y]; },          // right → left
        () => { const x = xr(); return [x, TOP - R * 1.4, x, H + R * 1.4]; },      // top → bottom
        () => [-R * 1.4, H + R * 0.6, W + R * 1.4, TOP - R * 0.6],                  // diagonal
        () => [W + R * 1.4, H + R * 0.6, -R * 1.4, TOP - R * 0.6],
      ];
      const [x0, y0, x1, y1] = rutas[this.nMonstruos++ % rutas.length]();
      const dur = Math.max(5, 8 - (this.stage - 4) * 0.3);
      this.monstruos.push({ x0, y0, x1, y1, R, t: 0, dur, warn: 2, paso: 0 });
      this.anunciarAlien = 2;
    },
    monPos(m) { const k = clamp(m.t / m.dur, 0, 1); return { x: m.x0 + (m.x1 - m.x0) * k, y: m.y0 + (m.y1 - m.y0) * k }; },

    // ---------- update ----------
    update(dt) {
      this.geo(dt);
      this.t += dt;
      if (this.banner && (this.banner.t += dt) > 2.8) this.banner = null;
      this.temblor = Math.max(0, this.temblor - dt);
      this.rayos = this.rayos.filter((r) => (r.t += dt) < 0.35);
      this.resta -= dt; this.ts += dt;
      if (this.resta <= 0) {
        this.resta = 0; this.puntos += 10 * this.stage;
        this.mejoraPendiente = this.opciones(); this.trasMejora = () => this.nextStage();
        return;
      }
      const fr = this.freeze > 0; this.freeze = Math.max(0, this.freeze - dt);
      this.agujeros = this.agujeros.filter((h) => (h.t += dt) < h.vida);

      // spawns
      if ((this.proxPlaneta -= dt) <= 0) {

      }
      if ((this.proxNave -= dt) <= 0) {
        const izq = Math.random() < .5;
        this.naves.push({ x: izq ? -40 : W + 40, y: rnd(TOP + 50, H - 120), vx: (izq ? 1 : -1) * rnd(80, 110), t: 0 });

      }
      if (this.meteorOn && (this.proxMeteoro -= dt) <= 0) {

      // planets
      const v = (62 + this.stage * 5) * this.slow;

          if (p.espera >= this.paciencia) { p.frenado = false; p.espera = 0; const P = this.pos(p); flotar(P.x, P.y - 16, "go!", "#ff8a8a"); }

        }
        const o = this.orb(p.o), w = v / o.r;
        p.a += w * p.dir * dt; p.recorrido += w * dt;

      }

      for (let i = 0; i < vivos.length; i++) for (let j = i + 1; j < vivos.length; j++) {
        const a = vivos[i], b = vivos[j];

          const P = this.pos(p); p.muerto = true; this.puntos++;

          const P = this.pos(p); p.muerto = m.muerto = true;

          const P = this.pos(p); p.muerto = true;

    },

    opciones() {
      const todas = [
        { t: "Repair kit", d: "Get one life back (max 5).", f: () => { this.vidas = Math.min(5, this.vidas + 1); }, si: () => this.vidas < 5 },
        { t: "Supply drop", d: "Get a random power right now.", f: () => { const k = this.darPoder(); flotar(W / 2, H / 2, this.POWERS[k].name + "!", this.POWERS[k].color); }, si: () => this.poderes.length < 3 },
        { t: "Calm orbits", d: "Planets move 10% slower.", f: () => { this.slow *= 0.9; }, si: () => this.slow > 0.6 },
        { t: "Patient planets", d: "Braked planets wait 1 s longer before taking off.", f: () => { this.paciencia += 1; }, si: () => this.paciencia < 6 },
      ].filter((o) => !o.si || o.si());
      if (!todas.length) todas.push({ t: "Continue", d: "On to the next stage.", f: () => {} });
      return {
        titulo: "Stage " + this.stage + " cleared!",
        texto: "+" + (10 * this.stage) + " points. Next: survive " + (15 + 5 * this.stage) + " s. Pick a bonus:",
        opciones: todas.sort(() => Math.random() - 0.5).slice(0, 3),

    // ---------- input ----------
    slot(i) { return { x: 16 + 26 + i * 60, y: H - 38 }; },
    planetaEn(x, y, rad) {
      let mejor = null, md = rad;
      for (const p of this.planetas) { const d = dist({ x, y }, this.pos(p)); if (d < md) { md = d; mejor = p; } }
      return mejor;
    },
    invertir(p) { p.dir *= -1; const P = this.pos(p); flotar(P.x, P.y - 18, "⟲ reverse", p.color); },
    onDown(x, y, boton) {
      // power slots
      for (let i = 0; i < this.poderes.length; i++) if (dist({ x, y }, this.slot(i)) < 27) {
        const k = this.poderes[i];
        if (k === "freeze") { this.poderes.splice(i, 1); this.armado = null; this.freeze = 3.5; flotar(W / 2, H / 2, "TIME FROZEN!", "#6ee7f9"); }

      }
      if (this.armado) {
        const { i, k } = this.armado;
        if (k === "laser") {
          const p = this.planetaEn(x, y, 40);
          if (!p) { flotar(x, y, "tap a planet", "#ff8a8a"); return; }
          const P = this.pos(p); this.rayos.push({ x: P.x, y: P.y, t: 0 });
          explotar(P.x, P.y, p.color, 34); p.muerto = true; this.planetas = this.planetas.filter((q) => !q.muerto);

        } else {
          this.agujeros.push({ x, y: Math.max(TOP + 20, y), r: clamp(this.S * 0.2, 16, 28), t: 0, vida: 8 });
          flotar(x, y - 24, "black hole", "#c4b5fd");
        }
        this.poderes.splice(i, 1); this.armado = null; return;
      }
      // spaceship
      for (const n of this.naves) if (dist({ x, y }, { x: n.x, y: n.y + Math.sin(n.t * 4) * 6 }) < 36) {
        this.naves = this.naves.filter((q) => q !== n);
        explotar(n.x, n.y, "#6ee7f9", 24);
        if (this.poderes.length >= 3) { this.puntos += 5; flotar(n.x, n.y - 16, "+5 (powers full)", "#6ee7f9"); }
        else { const k = this.darPoder(); flotar(n.x, n.y - 16, "POWER: " + this.POWERS[k].name.toUpperCase(), this.POWERS[k].color); }
        return;
      }
      // meteors
      for (const m of this.meteoros) if (m.warn <= 0 && dist({ x, y }, m) < m.r + 22) {

        explotar(m.x, m.y, "#ff9f43", 22); this.puntos += 2; flotar(m.x, m.y - 14, "+2", "#ff9f43");
        return;
      }

      if (!p) return;
      if (boton === 2) { this.invertir(p); return; }
      const ahora = performance.now();
      if (ahora - p.ultimoToque < 320) {
        p.frenado = p.prevFrenado; p.espera = p.prevEspera; p.ultimoToque = 0;
        this.invertir(p); return;
      }
      p.prevFrenado = p.frenado; p.prevEspera = p.espera;
      p.frenado = !p.frenado; p.espera = 0; p.ultimoToque = ahora;
    },

    // ---------- drawing ----------
    dibujarMonstruo(m) {

      // eye
      const blink = (t % 3.2) < 0.12;
      ctx.fillStyle = "#fffbe8"; ctx.beginPath(); ctx.ellipse(0, -R * 0.22, R * 0.38, blink ? R * 0.04 : R * 0.34, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#d61f4b"; ctx.beginPath(); ctx.arc(mira.x * R * 0.14, -R * 0.22 + mira.y * R * 0.12, R * 0.18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#0b0918"; ctx.beginPath(); ctx.ellipse(mira.x * R * 0.17, -R * 0.22 + mira.y * R * 0.14, R * 0.05, R * 0.13, 0, 0, Math.PI * 2); ctx.fill();
      }
      // mouth with teeth
      const ab = 0.5 + Math.sin(t * 5) * 0.5;
      ctx.fillStyle = "#3a0f1e"; ctx.beginPath(); ctx.ellipse(0, R * 0.42, R * 0.42, R * (0.08 + ab * 0.14), 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fffbe8";
      for (let k = -3; k <= 3; k++) { const tx = k * R * 0.11; ctx.beginPath(); ctx.moveTo(tx - R * 0.04, R * 0.34); ctx.lineTo(tx + R * 0.04, R * 0.34); ctx.lineTo(tx, R * 0.44); ctx.fill(); }
      ctx.restore();
    },
    aviso(x, y, txt, col, size) {
      const px = clamp(x, 26, W - 26), py = clamp(y, TOP + 46, H - 26);
      if (Math.sin(this.t * 14) < -0.2) return;
      ctx.save(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 14;

      ctx.fillText("!", px, py + size * 0.15);
      if (txt) { ctx.fillStyle = col; ctx.font = "400 13px " + css("--display"); ctx.fillText(txt, clamp(px, 60, W - 60), py + size + 14); }

    },
    iconoPoder(k, x, y, r) {
      ctx.save(); ctx.translate(x, y);
      if (k === "laser") {
        ctx.strokeStyle = "#ff5f6d"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.moveTo(-r * 0.75, 0); ctx.lineTo(r * 0.75, 0); ctx.moveTo(0, -r * 0.75); ctx.lineTo(0, r * 0.75); ctx.stroke();
      } else if (k === "hole") {
        ctx.fillStyle = "#05030d"; ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#c4b5fd"; ctx.lineWidth = 2;

    },
    draw() {

      }

        ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 16; ctx.fillStyle = p.color;

      }

      for (const m of this.meteoros) {

        ctx.fillStyle = "#cfd6e6"; ctx.beginPath(); ctx.ellipse(0, 0, 20, 6.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#7d86a3"; ctx.fillRect(-20, 0, 40, 2);

        ctx.restore();

      // laser beams
      for (const r of this.rayos) {
        ctx.save(); ctx.globalAlpha = 1 - r.t / 0.35; ctx.strokeStyle = "#ff5f6d"; ctx.shadowColor = "#ff5f6d"; ctx.shadowBlur = 18; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(r.x, TOP); ctx.lineTo(r.x, r.y); ctx.stroke(); ctx.restore();
      }
      ctx.restore();

      if (this.freeze > 0) { ctx.fillStyle = "rgba(110,231,249," + (0.08 + 0.04 * Math.sin(this.t * 8)) + ")"; ctx.fillRect(0, TOP, W, H - TOP); }

      // stage + timer bar
      ctx.font = "600 12px " + css("--ui"); ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#a9a2cc"; ctx.textAlign = "left"; ctx.fillText("STAGE " + this.stage, 14, TOP + 12);
      ctx.textAlign = "right"; ctx.fillStyle = this.resta < 5 ? "#ff8a8a" : "#f3efff";
      ctx.fillText(Math.ceil(this.resta) + "s left", W - 14, TOP + 12);
      ctx.fillStyle = "rgba(169,162,204,.18)"; ctx.fillRect(14, TOP + 18, W - 28, 5);
      ctx.fillStyle = "#ffb347"; ctx.fillRect(14, TOP + 18, (W - 28) * (1 - this.resta / this.duracion), 5);

      // power slots
      for (let i = 0; i < 3; i++) {
        const s = this.slot(i), k = this.poderes[i], arm = this.armado && this.armado.i === i;
        ctx.save();
        ctx.fillStyle = arm ? "rgba(255,95,109,.25)" : "rgba(28,24,54,.85)";
        ctx.strokeStyle = k ? (arm ? "#fff" : this.POWERS[k].color) : "rgba(169,162,204,.25)";
        ctx.lineWidth = arm ? 3 : 2; if (!k) ctx.setLineDash([4, 4]);
        if (arm) { ctx.shadowColor = this.POWERS[k].color; ctx.shadowBlur = 16; }
        ctx.beginPath(); ctx.arc(s.x, s.y, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
        if (k) this.iconoPoder(k, s.x, s.y, 18);
      }
      ctx.textAlign = "left"; ctx.font = "600 12px " + css("--ui");
      if (this.armado) { ctx.fillStyle = this.POWERS[this.armado.k].color; ctx.fillText(this.POWERS[this.armado.k].hint, 16 + 3 * 60, H - 34, W - 16 - 3 * 60 - 10); }
      else if (!this.poderes.length) { ctx.fillStyle = "rgba(169,162,204,.6)"; ctx.fillText("Tap a spaceship to get powers", 16 + 3 * 60, H - 34, W - 16 - 3 * 60 - 10); }

      pintarBanner(this.banner);
    },
  };

  function pintarBanner(b) {
    if (!b) return;
    const a = b.t < 0.3 ? b.t / 0.3 : b.t > 2 ? Math.max(0, 1 - (b.t - 2) / 0.5) : 1;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = "400 " + (W < 420 ? 15 : 19) + "px " + css("--display");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const w = Math.min(W - 24, ctx.measureText(b.txt).width + 28);
    ctx.fillStyle = "rgba(10,8,22,.75)";
    ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, TOP + 26, w, 36, 10); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.fillText(b.txt, W / 2, TOP + 45, W - 40);
    ctx.restore();
  }

  const JUEGOS = [Atasco];

  // ===================== Control de partida =====================
  let juego = null, estado = "menu"; // menu | intro | jugando | pausa | fin

  function abrir(j) {
    juego = j; estado = "intro";
    $("app").classList.toggle("retro", !!j.retro);
    $("menu").hidden = true; $("hud").hidden = false;
    $("hudTitulo").textContent = j.nombre;
    $("hudTitulo").style.color = "var(" + j.color + ")";
    flotantes = []; chispas = [];
    juego.init();
    actualizarHud();
    const ul = j.reglas.map((r) => "<li>" + r + "</li>").join("");
    panel(j, `<h3>${j.nombre}</h3>${j.intro ? `<p class="intro">${j.intro}</p>` : ""}<ul>${ul}</ul>
      <div class="botones"><button class="btn" id="bJugar" type="button">Play</button></div>`);
    $("bJugar").onclick = empezar; $("bJugar").focus();
  }
  function empezar() { juego.init(); flotantes = []; chispas = []; estado = "jugando"; $("overlay").hidden = true; actualizarHud(); }
  function panel(j, html) {
    const p = $("panel"); p.style.setProperty("--c", "var(" + j.color + ")"); p.innerHTML = html;
    p.classList.toggle("retro", !!j.retro);
    $("overlay").hidden = false;
  }
  function pausar() {
    if (estado !== "jugando") return;
    estado = "pausa";
    panel(juego, `<h3>Paused</h3><p>Score: ${juego.puntos}</p>
      <div class="botones"><button class="btn" id="bSeguir" type="button">Resume</button>
      <button class="btn sec" id="bSalir" type="button">Arcade</button></div>`);
    $("bSeguir").onclick = () => { estado = "jugando"; $("overlay").hidden = true; };
    $("bSalir").onclick = menu; $("bSeguir").focus();
  }
  function fin() {
    estado = "fin";
    const rec = store.get(juego.id), nuevo = juego.puntos > rec;
    if (nuevo) store.set(juego.id, juego.puntos);
    const frases = {
      atasco: "Space traffic shows no mercy. You reached stage " + juego.stage + ".",
      ascensor: "The tenants have called a building meeting. You lasted " + (juego.turno - 1) + " shifts.",
      sombra: "Your past caught up with you. You reached memory " + juego.sala + ".",
    };
    setTimeout(() => {
      panel(juego, `<h3>${nuevo ? "New high score!" : "Game over"}</h3><p>${frases[juego.id]}</p>
        <div class="marcador"><div><small>Score</small><strong>${juego.puntos}</strong></div>
        <div><small>Best</small><strong>${Math.max(rec, juego.puntos)}</strong></div></div>
        <div class="botones"><button class="btn" id="bOtra" type="button">Play again</button>
        <button class="btn sec" id="bMenu2" type="button">Arcade</button></div>`);
      $("bOtra").onclick = empezar; $("bMenu2").onclick = menu; $("bOtra").focus();
    }, 650);
  }
  function mostrarMejoras() {
    const m = juego.mejoraPendiente; juego.mejoraPendiente = null;
    estado = "mejora";
    const botones = m.opciones.map((o, i) =>
      `<button class="mejora" id="mej${i}" type="button"><b>${o.t}</b><span>${o.d}</span></button>`).join("");
    panel(juego, `<h3>${m.titulo}</h3><p>${m.texto}</p><div class="mejoras">${botones}</div>`);
    m.opciones.forEach((o, i) => {
      $("mej" + i).onclick = () => {
        o.f();
        if (juego.trasMejora) { juego.trasMejora(); juego.trasMejora = null; }
        estado = "jugando"; $("overlay").hidden = true; actualizarHud();
      };
    });
    $("mej0").focus();
  }
  function menu() { location.href = "../../index.html"; }
  function actualizarHud() {
    if (!juego) return;
    $("hudPuntos").textContent = juego.puntos;
    $("hudVidas").textContent = juego.vidas == null ? "" : "♥".repeat(Math.max(0, juego.vidas)) + "♡".repeat(Math.max(0, 3 - juego.vidas));
    $("hudVidas").style.color = "var(--infierno)";
  }
  $("btnMenu").onclick = menu;
  $("btnPausa").onclick = pausar;
  document.addEventListener("visibilitychange", () => { if (document.hidden) pausar(); });

  // ===================== Entrada =====================
  let puntero = null;
  cv.addEventListener("pointerdown", (e) => {
    if (estado !== "jugando") return;
    const r = cv.getBoundingClientRect();
    puntero = { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    juego.onDown && juego.onDown(puntero.x, puntero.y, e.button);
    e.preventDefault();
  });
  cv.addEventListener("contextmenu", (e) => e.preventDefault());
  cv.addEventListener("pointermove", (e) => {
    if (estado !== "jugando" || !puntero || e.pointerId !== puntero.id) return;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    juego.onMove && juego.onMove(x, y, x - puntero.x, y - puntero.y);
    puntero.x = x; puntero.y = y;
  });
  const soltar = () => { puntero = null; };
  cv.addEventListener("pointerup", soltar); cv.addEventListener("pointercancel", soltar);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.key === "p") { estado === "jugando" ? pausar() : null; }
    if (juego && juego.teclas) juego.teclas[e.key] = true;
  });
  window.addEventListener("keyup", (e) => { if (juego && juego.teclas) juego.teclas[e.key] = false; });

  // ===================== Bucle =====================
  let ultimo = performance.now();
  function bucle(ahora) {
    const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
    ctx.fillStyle = css("--noche"); ctx.fillRect(0, 0, W, H);
    if (estado === "menu") { requestAnimationFrame(bucle); return; }
    if (!juego.retro) pintarEstrellas(1);
    if (estado === "jugando") {
      juego.update(dt);
      actualizarHud();
      if (juego.over) fin();
      else if (juego.mejoraPendiente) mostrarMejoras();
    }
    juego.draw();
    pintarChispas(estado === "pausa" ? 0 : dt);
    pintarFlotantes(estado === "pausa" ? 0 : dt);
    requestAnimationFrame(bucle);
  }

  function arrancar() {
    genEstrellas(); resize();
    window.addEventListener("resize", resize);
    requestAnimationFrame(bucle);
    abrir(JUEGOS[0]);
  }

  arrancar();
})();
</script>
</body>
</html>
